# LoRA fine-tuning config for Fimbulvetr 11B v2
# Tuned for Apple Silicon with limited unified memory
# Key names follow the mlx-lm 0.30 schema

# LoRA hyperparameters
num_layers: 16           # Number of layers to apply LoRA to
lora_parameters:
  rank: 8                # Rank of LoRA matrices (lower = less memory, 8 is a good start)
  scale: 16.0            # Scaling factor (typically 2x rank)
  dropout: 0.05

# Training hyperparameters
batch_size: 1            # Keep at 1 for 11B on limited unified memory
iters: 1000              # Total training iterations
learning_rate: 1e-5      # Conservative LR for fine-tuning
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
lr_schedule:
  name: linear_schedule  # Warm up over 100 steps, then hold the rate flat
  arguments: [1e-5, 1e-5, 1000]
  warmup: 100

# Evaluation
val_batches: 25
steps_per_eval: 100
steps_per_report: 10

# Save
save_every: 200
adapter_path: "./adapters"
