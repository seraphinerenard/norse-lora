# LoRA fine-tuning config for Fimbulvetr 11B v2
# Tuned for Apple Silicon with limited unified memory

# LoRA hyperparameters
lora_layers: 16          # Number of layers to apply LoRA to
lora_rank: 8             # Rank of LoRA matrices (lower = less VRAM, 8 is a good start)
lora_alpha: 16           # Scaling factor (typically 2x rank)
lora_dropout: 0.05

# Training hyperparameters
batch_size: 1            # Keep at 1 for 11B on limited unified memory
iters: 1000              # Total training iterations
learning_rate: 1e-5      # Conservative LR for fine-tuning
warmup_iters: 100        # Linear warmup steps
weight_decay: 0.01

# Evaluation
val_batches: 25
steps_per_eval: 100
steps_per_report: 10

# Save
save_every: 200
adapter_path: "./adapters"
